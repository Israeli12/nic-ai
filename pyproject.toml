[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nic-ai"
version = "0.1.0"
description = "A fully offline assistant that controls your laptop and phone"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "pillow>=10.0"]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "soundfile>=0.12"]
dev = ["pytest>=8.0"]

[project.scripts]
nic = "nic.cli:main"

[tool.setuptools.packages.find]
include = ["nic*"]

[tool.setuptools.package-data]
"nic.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
